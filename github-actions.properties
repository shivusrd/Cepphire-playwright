# GitHub Actions Configuration Properties
# These properties are used when running tests in GitHub Actions CI/CD pipeline

# Application Configuration (will be overridden by GitHub Secrets)
base.url=${BASE_URL:https://cepphire.com}
auth.url=${BASE_URL:https://cepphire.com}/auth
dashboard.url=${BASE_URL:https://cepphire.com}/dashboard

# Test User Credentials (will be overridden by GitHub Secrets)
default.username=${USER_EMAIL:admin@ukg.com}
default.password=${USER_PASSWORD:defaultpassword}

# Browser Configuration
browser=${BROWSER:chromium}
headless=${HEADLESS:true}

# Test Execution Configuration
timeout=${TEST_TIMEOUT:60000}
capture.screenshot.on.failure=${CAPTURE_SCREENSHOT:true}
capture.trace=${CAPTURE_TRACE:true}
extent.reporter.html.start=${EXTENT_REPORTER:true}

# GitHub Actions Specific Settings
ci.environment=true
ci.headless=true
ci.screenshot.path=test-output/screenshots
ci.trace.path=test-output/traces
ci.video.path=test-output/videos
ci.report.path=test-output

# Parallel Execution
parallel.execution=${PARALLEL_EXECUTION:false}
thread.count=${THREAD_COUNT:1}

# Reporting Configuration
report.generate.html=${GENERATE_HTML_REPORT:true}
report.generate.json=${GENERATE_JSON_REPORT:false}
report.include.system.info=${INCLUDE_SYSTEM_INFO:true}

# Debug Configuration
debug.mode=${DEBUG_MODE:false}
verbose.logging=${VERBOSE_LOGGING:false}
playwright.trace=${PLAYWRIGHT_TRACE:true}

# Performance Configuration
slow.mo=${SLOW_MO:0}
viewport.width=${VIEWPORT_WIDTH:1280}
viewport.height=${VIEWPORT_HEIGHT:720}
