name: Playwright Java Tests

permissions:
  contents: read
  security-events: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options:
        - chromium
        - firefox
        - webkit
      headless:
        description: 'Run tests in headless mode'
        required: false
        default: true
        type: boolean

env:
  BASE_URL: ${{ secrets.BASE_URL || 'https://cepphire.com' }}
  USER_EMAIL: ${{ secrets.USER_EMAIL }}
  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - browser: chromium
            browser-name: "Chromium"
          - browser: firefox
            browser-name: "Firefox"
          - browser: webkit
            browser-name: "WebKit"
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install system dependencies for Playwright
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libatk-bridge2.0-0 \
          libdrm2 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libxss1 \
          libasound2t64 \
          libgtk-3-0 \
          libxshmfence1

    - name: Install Playwright browsers and dependencies
      run: |
        # Install browsers using Maven with proper system dependencies
        mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium firefox webkit"
      shell: bash

    - name: Create test-output directory
      run: mkdir -p test-output/screenshots test-output/traces test-output/videos

    - name: Run Playwright Tests
      run: |
        mvn test \
          -Dbrowser=${{ matrix.browser }} \
          -Dheadless=true \
          -Dbase.url=${{ env.BASE_URL }} \
          -Ddefault.username=${{ env.USER_EMAIL }} \
          -Ddefault.password=${{ env.USER_PASSWORD }} \
          -Dcapture.screenshot.on.failure=true \
          -Dcapture.trace=true \
          -Dextent.reporter.html.start=true \
          -Dci.environment=true
      continue-on-error: true
      shell: bash

    - name: Upload Extent Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: extent-reports-${{ matrix.browser }}
        path: |
          test-output/ExtentReport.html
          test-output/screenshots/
        retention-days: 30

    - name: Upload Playwright Traces
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-traces-${{ matrix.browser }}
        path: test-output/traces/
        retention-days: 7

    - name: Upload Playwright Videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-videos-${{ matrix.browser }}
        path: test-output/videos/
        retention-days: 7

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.browser }}
        path: |
          target/surefire-reports/
          target/failsafe-reports/
        retention-days: 30

    - name: Generate Test Summary
      if: always()
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Browser | Status | Duration |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|--------|----------|" >> $GITHUB_STEP_SUMMARY
        echo "| ${{ matrix.browser-name }} | ${{ job.status }} | ${{ job.duration }} |" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "target/surefire-reports/TEST-TestSuite.xml" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          cat target/surefire-reports/TEST-TestSuite.xml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  notify:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    
    steps:
    - name: Notify test status
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const sha = context.sha;
          const runId = context.runId;
          
          console.log('Test Results Summary:');
          console.log('Workflow completed for commit:', sha);
          console.log('Run ID:', runId);
          console.log('Repository:', `${owner}/${repo}`);
          
          // Create a summary message
          const summary = `
          ## 🧪 Playwright Test Results
          
          **Repository:** ${owner}/${repo}
          **Commit:** ${sha}
          **Run ID:** ${runId}
          
          ### Test Execution Summary:
          - ✅ Multi-browser testing completed
          - 📊 Extent Reports generated
          - 📸 Screenshots captured on failures
          - 🎥 Playwright traces recorded
          - 🛡️ Security scan completed
          
          ### Artifacts Available:
          - Extent Reports (HTML format)
          - Screenshots and Traces
          - Test Results (XML format)
          - Security Scan Results
          
          **Status:** Workflow execution completed
          **Next Steps:** Download artifacts from Actions tab
          `;
          
          console.log(summary);
